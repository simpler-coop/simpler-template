name: "Deliverable mapping: Repo level"

on:
  workflow_dispatch:
  # TODO: re-enable workflow triggers (schedule and pull_request) once ready
  # pull_request:
  #   paths:
  #     - ".github/linters/deps_mapping/**"
  #     - ".github/workflows/deps-mapping-repo.yml"
  # schedule:
  #   - cron: "0 0 * * 1" # run weekly at midnight on Monday

permissions:
  issues: write
  contents: write

defaults:
  run:
    working-directory: ./.github/linters/deps_mapping

jobs:
  sync:
    # Only run this job if the PR is from the same repository,
    # Or if the workflow is triggered manually or on a schedule
    if: |
      github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GITHUB_API_TOKEN: ${{ secrets.GH_TOKEN_PROJECT_ACCESS }}
      # Local runs can override these defaults with DEPS_MAPPING_ORG and DEPS_MAPPING_REPO.
      DEPS_MAPPING_DEFAULT_ORG: ${{ github.repository_owner }}
      DEPS_MAPPING_DEFAULT_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout code
        if: env.LOCAL_ACTIONS != 'true'
        uses: actions/checkout@v4
        with:
          # TODO: confirm this is the right token? 
          token: ${{ secrets.GH_TOKEN_PROJECT_ACCESS }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run script
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        run: |
          org="${DEPS_MAPPING_ORG:-$DEPS_MAPPING_DEFAULT_ORG}"
          repo="${DEPS_MAPPING_REPO:-$DEPS_MAPPING_DEFAULT_REPO}"
          python run.py \
            --org "$org" \
            --repo "$repo" \
            --project 1 \
            --scope "repo"

      - name: Commit changes to PR
        # Commit changes to PR when triggered by a PR, and don't skip CI
        # We don't want to skip CI because it will prevent the bump version workflow
        # from running on the main branch after the PR is merged
        if: github.event_name == 'pull_request'
        run: |
          if [[ "${LOCAL_ACTIONS:-false}" == "true" ]]; then
            echo "Local act run: skipping commit and push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../../../documentation/dependencies.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Update dependencies.md with dependency diagram"
            git push
          fi

      - name: Commit changes to main
        # Commit changes to main with skip CI when triggered manually or on a schedule
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${LOCAL_ACTIONS:-false}" == "true" ]]; then
            echo "Local act run: skipping commit and push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../../../documentation/dependencies.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Update dependencies.md with dependency diagram [skip ci]"
            git push
          fi
