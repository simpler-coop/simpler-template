name: "Deliverable mapping: Issue level"

on:
  workflow_dispatch: # for manual runs
  # TODO: re-enable workflow triggers (pull_request and schedule) once ready
  # pull_request:
  #   paths:
  #     - ".github/linters/deps_mapping/**"
  #     - ".github/workflows/deps-mapping-issue.yml"
  # schedule:
  #   - cron: "0 0 * * 1" # run weekly at midnight on Monday

permissions:
  issues: write

defaults:
  run:
    working-directory: ./.github/linters/deps_mapping

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Local runs can override these defaults with DEPS_MAPPING_ORG and DEPS_MAPPING_REPO.
      DEPS_MAPPING_DEFAULT_ORG: ${{ github.repository_owner }}
      DEPS_MAPPING_DEFAULT_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout code
        if: env.LOCAL_ACTIONS != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      ## TODO: update project ID to be a variable
      - name: Run script (dry run)
        if: github.event_name == 'pull_request'
        run: |
          org="${DEPS_MAPPING_ORG:-$DEPS_MAPPING_DEFAULT_ORG}"
          repo="${DEPS_MAPPING_REPO:-$DEPS_MAPPING_DEFAULT_REPO}"
          python run.py \
            --org "$org" \
            --repo "$repo" \
            --project 1 \
            --scope "issue" \
            --dry-run

      ## TODO: update project ID to be a variable
      - name: Run script (real run)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          org="${DEPS_MAPPING_ORG:-$DEPS_MAPPING_DEFAULT_ORG}"
          repo="${DEPS_MAPPING_REPO:-$DEPS_MAPPING_DEFAULT_REPO}"
          dry_run_args=()
          if [[ "${LOCAL_ACTIONS:-false}" == "true" ]]; then
            dry_run_args+=(--dry-run)
          fi

          python run.py \
            --org "$org" \
            --repo "$repo" \
            --project 1 \
            --scope "issue" \
            "${dry_run_args[@]}"
