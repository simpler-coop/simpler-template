name: "Deliverable mapping: Issue level"

on:
  workflow_dispatch: # for manual runs
  # TODO: re-enable workflow triggers (pull_request and schedule) once ready
  # pull_request:
  #   paths:
  #     - ".github/linters/deps_mapping/**"
  #     - ".github/workflows/deps-mapping-issue.yml"
  # schedule:
  #   - cron: "0 0 * * 1" # run weekly at midnight on Monday

permissions:
  issues: write

defaults:
  run:
    working-directory: ./.github/linters/deps_mapping

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      ## TODO: update project ID to be a variable
      - name: Run script (dry run)
        if: github.event_name == 'pull_request'
        run: |
          python run.py \
            --org "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --project 1 \
            --statuses "Todo" \
            --statuses "Prioritized" \
            --statuses "Planning" \
            --statuses "In Progress" \
            --statuses "Done" \
            --issue-type "Deliverable" \
            --scope "issue" \
            --dry-run

      - name: Run script (real run)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          python run.py \
            --org "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            ## TODO: update project ID to be a variable
            --project 1 \
            --statuses "Prioritized" \
            --statuses "Planning" \
            --statuses "In Progress" \
            --statuses "Done" \
            --issue-type "Deliverable" \
            --scope "issue"
